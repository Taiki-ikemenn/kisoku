<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>規則を守れ! / 規則を守って1Fに着け!</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2315171a'/%3E%3Cpath d='M12 50h14V38h12V26h14' fill='none' stroke='%23e9e5da' stroke-width='5'/%3E%3Crect x='44' y='10' width='10' height='10' fill='%23e04a3a'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1012;--bg2:#15181b;--line:#2a2f34;--paper:#e9e5da;--ink:#15171a;--mute:#8d979e;--red:#e04a3a;--red2:#a8281c;--blue:#2f6fb3;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--paper);font-family:var(--sans);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#bar{height:46px;flex:none;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg2);font:500 12px var(--mono);letter-spacing:.14em;color:var(--mute)}
#bar .zone{color:var(--paper)}
#bar .sp{flex:1}
.tbtn{background:transparent;border:1px solid var(--line);color:var(--paper);padding:6px 12px;font:500 12px var(--mono);letter-spacing:.1em;border-radius:2px}
.tbtn:hover{border-color:var(--mute)}
#main{flex:1;min-height:0;display:flex}
#sheet{width:318px;flex:none;padding:14px;border-right:1px solid var(--line);background:var(--bg2);overflow:auto}
#stageWrap{flex:1;min-width:0;position:relative}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer;touch-action:none}
#msg{position:absolute;left:50%;top:62px;transform:translateX(-50%);max-width:80%;padding:8px 16px;border:1px solid var(--line);background:rgba(14,16,18,.94);font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;display:flex;align-items:center;gap:8px}
#msg.on{opacity:1}
#stanceBar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:8px}
.stb{display:flex;align-items:center;gap:8px;padding:8px 16px;background:rgba(21,24,27,.95);border:2px solid var(--line);color:var(--paper);font:700 14px var(--sans);border-radius:3px}
.stb.on{border-color:var(--paper);background:var(--paper);color:var(--ink)}
.stb small{font:500 10px var(--mono);opacity:.6}

#stick{position:absolute;left:18px;bottom:14px;width:132px;height:132px;border-radius:50%;background:rgba(21,24,27,.75);border:2px solid var(--line);touch-action:none;z-index:4}
#stick::before{content:"";position:absolute;inset:0;background:linear-gradient(var(--line),var(--line)) center/2px 70% no-repeat,linear-gradient(var(--line),var(--line)) center/70% 2px no-repeat}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.5)}
.mapchip{display:flex;align-items:center;justify-content:center;gap:8px;font:500 13px var(--mono);letter-spacing:.14em;color:var(--mute);margin:0 0 14px}
body.calm *{animation-duration:.001s!important;animation-delay:0s!important;transition-duration:.001s!important}
/* controls */
#stageWrap[data-ctl="stick"] #stick{display:block}
#dpad{display:none;position:absolute;bottom:14px;width:156px;height:156px;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:4px;z-index:4;touch-action:none}
#stageWrap[data-ctl="dpad"] #dpad{display:grid}
#stick{display:none}
#stageWrap[data-side="left"] #stick,#stageWrap[data-side="left"] #dpad{left:18px;right:auto}
#stageWrap[data-side="right"] #stick,#stageWrap[data-side="right"] #dpad{right:18px;left:auto}
#dpad button{border:2px solid var(--line);background:rgba(21,24,27,.85);border-radius:10px;position:relative;transition:transform .08s,background .15s;touch-action:none}
#dpad button.on{background:var(--paper);transform:scale(.93)}
#dpad button::after{content:"";position:absolute;left:50%;top:50%;width:0;height:0;margin:-8px 0 0 -9px;border:9px solid transparent}
#dpad .u{grid-column:2;grid-row:1}#dpad .l{grid-column:1;grid-row:2}#dpad .r{grid-column:3;grid-row:2}#dpad .d{grid-column:2;grid-row:3}
#dpad .u::after{border-bottom:14px solid #e9e5da;border-top:0;margin-top:-7px}
#dpad .d::after{border-top:14px solid #e9e5da;border-bottom:0;margin-top:-7px}
#dpad .l::after{border-right:14px solid #e9e5da;border-left:0;margin-left:-7px}
#dpad .r::after{border-left:14px solid #e9e5da;border-right:0;margin-left:-7px}
#dpad .on::after{filter:invert(1)}
/* settings */
.box.wide{width:min(720px,100%)}
.sh{margin:4px 0 18px;text-align:center;font-size:34px;font-weight:900;letter-spacing:.2em}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:12px 0;padding:10px 14px;border:1px solid var(--line);background:rgba(21,24,27,.7)}
.setrow label{font-weight:700;font-size:14px;flex:1}
.dd{position:relative;width:300px;max-width:55%}
.ddb{width:100%;display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg);border:2px solid var(--line);color:var(--paper);text-align:left;border-radius:3px;transition:border-color .2s}
.ddb:hover,.dd.open .ddb{border-color:var(--paper)}
.ddb svg:last-child{margin-left:auto;transition:transform .3s}
.dd.open .ddb svg:last-child{transform:rotate(180deg)}
.ddt{display:flex;flex-direction:column;line-height:1.35}.ddt b{font-size:14px}.ddt small{font-size:11px;color:var(--mute)}
.ddl{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;background:#101316;border:2px solid var(--paper);border-radius:3px;padding:4px;opacity:0;visibility:hidden;transform:translateY(-8px) scale(.98);transform-origin:top;transition:opacity .22s,transform .22s,visibility .22s}
.dd.open .ddl{opacity:1;visibility:visible;transform:none}
.ddo{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;background:transparent;border:0;color:var(--paper);text-align:left;border-radius:2px;opacity:0;transform:translateX(-8px)}
.dd.open .ddo{animation:cardIn .35s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*45ms)}
.ddo:hover{background:#1d2328}.ddo.on{background:#262d33}
.tg{width:56px;height:30px;border-radius:15px;background:#2a2f34;border:2px solid var(--line);position:relative;transition:background .25s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--paper);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.tg.on{background:var(--red);border-color:var(--red)}.tg.on::after{transform:translateX(26px)}
.snd{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);background:rgba(21,24,27,.7);margin-bottom:6px}
.snd .sico{width:30px;display:flex;justify-content:center}.snd .sn{width:120px;font-size:14px;font-weight:700}
.snd.off input,.snd.off .sico,.snd.off .sn{opacity:.35}
.snd .pct{width:40px;text-align:right;font:500 12px var(--mono);color:var(--mute)}
.snd .tbtn{padding:5px 10px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--red) var(--p,50%),#2a2f34 var(--p,50%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);box-shadow:0 0 0 2px var(--paper);cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);cursor:pointer}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px;color:#b9c1c6;line-height:1.7}
.keys div{border:1px solid var(--line);padding:10px 12px;background:rgba(21,24,27,.7)}.keys b{display:block;color:var(--paper);margin-bottom:2px}
kbd{font:500 11px var(--mono);border:1px solid #59626a;border-bottom-width:3px;padding:1px 6px;border-radius:3px;color:var(--paper)}
/* animation */
@keyframes cardIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes stamp{0%{opacity:0;transform:scale(1.9)}60%{opacity:1;transform:scale(.96)}100%{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes lit{0%,16%{background:var(--paper);color:var(--ink);border-color:var(--paper)}22%,100%{background:transparent;color:var(--mute);border-color:var(--line)}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.1)}100%{opacity:1;transform:none}}
@keyframes roll{from{opacity:0;transform:translateY(-70%)}to{opacity:1;transform:none}}
.screen.on .box{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.rc[style*="--i"]{animation:cardIn .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*90ms)}
#floorBig b{display:inline-block;animation:roll .5s cubic-bezier(.2,.8,.2,1) both}
#brief .big b{display:inline-block;animation:roll .6s cubic-bezier(.2,.8,.2,1) both}
.btn{transition:transform .15s,background .2s}.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.97)}
.tbtn{transition:border-color .2s,transform .12s}.tbtn:active{transform:scale(.95)}
.stb{transition:transform .12s,background .2s,color .2s,border-color .2s}.stb:active{transform:scale(.94)}
h1{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.sub{font-weight:700;font-size:clamp(16px,3.2vw,26px);letter-spacing:.2em;margin:6px 0 4px;color:var(--paper);animation:rise .9s .15s cubic-bezier(.2,.8,.2,1) both}
.how div{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}.how div:nth-child(2){animation-delay:.1s}.how div:nth-child(3){animation-delay:.2s}
#tower{position:absolute;right:calc(50% + 350px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:5px;pointer-events:none}
#tower div{width:64px;height:28px;border:1px solid var(--line);color:var(--mute);font:500 12px var(--mono);display:flex;align-items:center;justify-content:center;animation:lit 5s infinite}
@media(max-width:1180px){#tower{display:none}}
#dead .big{animation:stamp .5s cubic-bezier(.2,1.2,.4,1) both}
#end .chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:16px 0}
#end .chips span{border:1px solid var(--paper);padding:6px 10px;font:700 13px var(--mono);animation:pop .4s both;animation-delay:calc(var(--i)*.12s + .3s)}
#doors{position:fixed;inset:0;z-index:60;pointer-events:none}
#doors .dl,#doors .dr{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(90deg,#171b1f,#0e1012);transition:transform .55s cubic-bezier(.7,0,.3,1)}
#doors .dl{left:0;transform:translateX(-101%);border-right:3px solid #2a2f34}
#doors .dr{right:0;transform:translateX(101%);border-left:3px solid #2a2f34}
#doors.closed{pointer-events:auto}
#doors.closed .dl,#doors.closed .dr{transform:none}
#dNum{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);font:900 clamp(48px,11vw,110px) var(--sans);letter-spacing:.06em;opacity:0;transition:opacity .3s .35s,transform .5s .35s;color:var(--paper);white-space:nowrap}
#doors.closed #dNum{opacity:1;transform:translate(-50%,-50%) scale(1)}
/* building meter */
#meter{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-bottom:12px}
#meter div{height:26px;display:flex;align-items:center;justify-content:center;font:500 11px var(--mono);border:1px solid var(--line);color:var(--mute)}
#meter div.cur{background:var(--paper);color:var(--ink);border-color:var(--paper);font-weight:700}
#meter div.done{background:#222a30;color:#6f8590}
#floorBig{display:flex;align-items:baseline;gap:10px;margin:2px 0 10px}
#floorBig b{font:900 44px var(--sans);letter-spacing:.04em}
#floorBig span{color:var(--mute);font:500 12px var(--mono);letter-spacing:.14em}

/* rule card */
.rc{display:flex;gap:10px;align-items:center;background:var(--paper);color:var(--ink);padding:9px 11px;border-left:6px solid var(--red);margin-bottom:8px;border-radius:2px;position:relative}
.rc.must{border-left-color:var(--blue)}
.rc .ico{flex:none;display:flex;align-items:center;gap:2px;min-width:44px}
.rc .plus{font:700 14px var(--mono);color:#777;margin:0 1px}
.rc .tx{font-weight:700;font-size:14.5px;line-height:1.5;padding-right:30px;padding-top:6px}
.rc .tag{position:absolute;right:6px;top:4px;font:700 10px var(--mono);letter-spacing:.14em;color:var(--red2)}
.rc.must .tag{color:var(--blue)}
.rc.bad{outline:4px solid var(--red);outline-offset:1px}
.sw{display:inline-block;width:18px;height:18px;border-radius:3px;border:2px solid #15171a;vertical-align:middle}
.hdr{font:500 11px var(--mono);letter-spacing:.2em;color:var(--mute);margin:14px 0 8px}

.screen{position:fixed;inset:0;display:none;z-index:20;align-items:center;justify-content:center;padding:20px;background:radial-gradient(70rem 40rem at 50% 20%,#1b2024,#0a0b0c)}
.screen.on{display:flex}
.btn{border:1px solid var(--paper);background:var(--paper);color:var(--ink);padding:14px 34px;font:900 17px var(--sans);letter-spacing:.24em;border-radius:2px}
.btn:hover{background:#fff}
.btn.ghost{background:transparent;color:var(--paper);border-color:var(--line);font-weight:700;font-size:14px;padding:12px 22px;letter-spacing:.14em}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.box{width:min(640px,100%);max-height:100%;overflow:auto;position:relative;z-index:1}
h1{margin:6px 0;font-size:clamp(40px,8vw,78px);font-weight:900;letter-spacing:.12em;line-height:1.05}
h1 span{color:var(--red)}
.k{font:500 12px var(--mono);letter-spacing:.4em;color:var(--mute)}
.lead{color:#b9c1c6;line-height:1.9;font-size:15px;margin:12px 0 22px}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 24px}
.how div{border:1px solid var(--line);padding:14px 8px;text-align:center;background:rgba(21,24,27,.7);font-size:13px;line-height:1.6}
.how .ic{display:block;margin:0 auto 8px}
#brief .big{display:flex;align-items:baseline;justify-content:center;gap:12px;margin-bottom:12px}
#brief .big b{font:900 72px var(--sans);letter-spacing:.04em}
#brief .big span{font:500 12px var(--mono);letter-spacing:.2em;color:var(--mute)}
#dead{background:radial-gradient(60rem 36rem at 50% 40%,#3a0f0c,#0a0505)}
#dead .big{font-size:clamp(34px,7vw,60px);font-weight:900;letter-spacing:.14em;color:var(--red);margin:0 0 14px;text-align:center}
#dead .why{color:#e2b1aa;font-size:15px;margin:8px 0 22px;text-align:center;letter-spacing:.04em}
#fade{position:fixed;inset:0;background:#0a0b0c;opacity:0;pointer-events:none;z-index:30;transition:opacity .6s ease}
#list .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:0 12px}
#list .cat{grid-column:1/-1}
#end h2{font-size:clamp(30px,6vw,52px);font-weight:900;letter-spacing:.14em;margin:0 0 8px;text-align:center}
#end p{color:#b9c1c6;line-height:1.9;text-align:center}
@media(max-width:900px){#sheet{display:none}#sheet.show{display:block;position:absolute;z-index:6;left:0;top:0;bottom:0;width:min(88vw,340px);box-shadow:0 0 0 100vmax rgba(0,0,0,.6)}.how{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <span class="zone">規則を守れ!</span><span id="info"></span><span class="sp"></span>
    <button class="tbtn" id="rulesBtn">規則書</button><button class="tbtn" id="listBtn">全規則</button><button class="tbtn" id="setTop">設定</button><button class="tbtn" id="menuBtn">タイトル</button>
  </div>
  <div id="main">
    <aside id="sheet"></aside>
    <div id="stageWrap"><canvas id="stage"></canvas><div id="msg"></div>
      <div id="stanceBar"></div>
      <div id="stick"><div id="knob"></div></div>
      <div id="dpad"><button data-d="0,-1" class="u"></button><button data-d="-1,0" class="l"></button><i></i><button data-d="1,0" class="r"></button><button data-d="0,1" class="d"></button></div></div>
  </div>
</div>

<section id="title" class="screen on"><div id="tower" aria-hidden="true"></div><div class="box" style="text-align:center">
  <div class="k">RULES / DESCENT</div>
  <h1>規則を<span>守れ!</span></h1>
  <div class="sub">規則を守って1Fに着け!</div>
  <p class="lead">あなたは10階にいる。出口は1階。<br>階ごとに規則は毎回ランダムに変わる。読み、守り、階段を降りろ。</p>
  <div class="how" id="how"></div>
  <div class="row"><button class="btn red" id="startBtn">スタート</button><button class="btn ghost" id="allBtn">規則を見る</button><button class="btn ghost" id="setBtn">設定</button></div>
  <p class="lead" style="margin-top:20px;font-size:13px" id="best"></p>
</div></section>

<section id="brief" class="screen"><div class="box">
  <div class="big"><b id="bFloor">10F</b><span id="bSub">出口は 1F</span></div><div class="mapchip" id="bMap"></div>
  <div id="bRules"></div>
  <div class="row" style="margin-top:14px"><button class="btn" id="goBtn">この階に入る</button></div>
  <p style="text-align:center;color:#8d979e;font-size:12px;margin-top:12px;letter-spacing:.08em" id="bHint"></p>
</div></section>

<section id="dead" class="screen"><div class="box">
  <p class="big">違反</p><div id="dRule"></div><div class="why" id="dWhy"></div>
  <div class="row"><button class="btn red" id="retryBtn">この階をやり直す</button><button class="btn ghost" id="newBtn">最初から（新しい規則）</button></div>
</div></section>

<section id="end" class="screen"><div class="box">
  <h2>脱出</h2><p id="endText"></p>
  <div class="row" style="margin-top:20px"><button class="btn red" id="againBtn">もう一度（新しい規則）</button><button class="btn ghost" id="endMenu">タイトル</button></div>
</div></section>

<section id="list" class="screen"><div class="box">
  <div class="k" style="text-align:center" id="listK"></div>
  <div id="listBody"></div>
  <div class="row" style="margin:14px 0"><button class="btn ghost" id="listClose">閉じる</button></div>
</div></section>
<div id="doors"><div class="dl"></div><div class="dr"></div><div id="dNum"></div></div>
<section id="settings" class="screen"><div class="box wide">
  <div class="k" style="text-align:center">SETTINGS</div>
  <h2 class="sh">設定</h2>
  <div class="setrow"><label>操作方法</label><div id="ddCtl"></div></div>
  <div class="setrow" id="rowSide"><label>ジョイスティック / 方向ボタンの位置</label><div id="ddSide"></div></div>
  <div class="setrow"><label>アニメーションを控えめにする</label><div id="tgCalm"></div></div>
  <div class="hdr">効果音</div>
  <div class="snd master"><span class="sico" id="mIco"></span><span class="sn">全体の音量</span><input type="range" min="0" max="100" id="vMaster"><span class="pct" id="pMaster"></span></div>
  <div id="sndList"></div>
  <div class="hdr">キーボード / コントローラー</div>
  <div class="keys" id="keyHelp"></div>
  <div class="row" style="margin:18px 0 6px"><button class="btn" id="setClose">閉じる</button></div>
</div></section>

<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ================= アイコン（SVG） ================= */
const IC={

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function shuffle(a,rng){for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const pick=(a,rng)=>a[Math.floor(rng()*a.length)];

const EV={alarm:[7,11],chime:[6,9],black:[2,6]};
function evOn(fl,k,t,m){ const a=EV[k][0],b=EV[k][1],u=(((t-fl.off)%CYC)+CYC)%CYC,e=m?.3:0; return u>=a-e&&u<b+e; }
function camAngle(cm,t){ return cm.base+cm.amp*Math.sin(2*Math.PI*t/cm.per+cm.ph); }
function camSees(fl,cm,t,px,py,m){
  const dx=px-cm.px,dy=py-cm.py,d=Math.hypot(dx,dy); if(d<6) return false;
  if(d>cm.range+(m?18:0)) return false;
  let da=Math.atan2(dy,dx)-camAngle(cm,t); da=Math.atan2(Math.sin(da),Math.cos(da));
  if(Math.abs(da)>cm.fov+(m?.12+14/d:0)) return false;
  if(m) return true;
  const n=Math.ceil(d/10), ptx=Math.floor(px/TS), pty=Math.floor(py/TS);
  for(let i=1;i<n;i++){ const x=cm.px+dx*i/n,y=cm.py+dy*i/n,tx=Math.floor(x/TS),ty=Math.floor(y/TS);
    if(tx<0||ty<0||tx>=GW||ty>=GH) continue; if(fl.obst[ty*GW+tx]&&!(tx===ptx&&ty===pty)) return false; }
  return true;
}
function guardPos(g,t){ const u=(((t+g.ph)%g.per)+g.per)%g.per/g.per, tri=u<.5?u*2:2-2*u; const dir=u<.5?1:-1;
  return {x:g.ax+(g.bx-g.ax)*tri,y:g.ay+(g.by-g.ay)*tri,fx:(g.bx-g.ax)*dir,fy:(g.by-g.ay)*dir}; }
function guardNear(fl,c,rad){ for(const g of fl.guards){ const p=guardPos(g,c.t); if(Math.hypot(c.px-p.x,c.py-p.y)<(rad+(c.m?.3:0))*TS) return true; } return false; }
function guardSight(fl,c){ for(const g of fl.guards){ const p=guardPos(g,c.t),dx=c.px-p.x,dy=c.py-p.y,d=Math.hypot(dx,dy); if(d>(4+(c.m?.3:0))*TS||d<1) continue;
  let da=Math.atan2(dy,dx)-Math.atan2(p.fy,p.fx); da=Math.atan2(Math.sin(da),Math.cos(da)); if(Math.abs(da)<.6+(c.m?.2:0)) return true; } return false; }
class Ctx{
  constructor(fl,bfs){this.fl=fl;this.bfs=bfs;this.m=bfs;this.sub=0;this.pi=0;this.t=0;this.abs=0;this.px=0;this.py=0;this.tx=0;this.ty=0;this.moving=false;this.stance="walk";this.key=false;this.card=false;this.still=0;this.col="";}
  cam(mask){ if(this.bfs) return (this.fl.camMask[this.sub*NP+this.pi]&mask)!==0;
    for(const cm of this.fl.cams){ if((COLBIT[cm.col]&mask)&&camSees(this.fl,cm,this.t,this.px,this.py,false)) return true; } return false; }
  item(){ return this.fl.itemGrid[this.ty*GW+this.tx]; }
}

function conflict(a,b){
  const hit=(x,y)=>(x.conf||[]).some(k=>k===y.id||k===y.g);
  return hit(a,b)||hit(b,a);
}
function pickRules(count,rng,n,must){
  const chosen=[],gc={};
  const add=r=>{chosen.push(r);gc[r.g]=(gc[r.g]||0)+1;};
  (must||[]).forEach(id=>add(RM[id]));
  const pool=shuffle(RULES.slice(),rng);
  for(const r of pool){
    if(chosen.length>=count) break;
    if(chosen.includes(r)) continue;
    if((gc[r.g]||0)>=GROUPCAP[r.g]) continue;
    if(chosen.some(c=>conflict(c,r))) continue;
    add(r);
  }
  return chosen;
}

const range=(a,b)=>{const o=[];for(let i=a;i<=b;i++)o.push(i);return o;};
const MAPS=[
 {id:"open",name:"広間",gen:r=>[]},
 {id:"pillar",name:"柱の広間",gen:r=>[[3,2],[3,6],[6,3],[6,5],[9,3],[9,5],[12,2],[12,6],[4,4],[11,4]]},
 {id:"hall",name:"回廊",gen:r=>{const g1=4+Math.floor(r()*8),g2=4+Math.floor(r()*8),o=[];range(3,12).forEach(x=>{if(x!==g1)o.push([x,2]);if(x!==g2)o.push([x,6]);});return o;}},
 {id:"rooms",name:"仕切り部屋",gen:r=>{const a=1+Math.floor(r()*6),b=1+Math.floor(r()*6),o=[];range(0,8).forEach(y=>{if(y!==a&&y!==a+1)o.push([5,y]);if(y!==b&&y!==b+1)o.push([10,y]);});return o;}},
 {id:"cross",name:"十字路",gen:r=>{const gx1=2+Math.floor(r()*5),gx2=9+Math.floor(r()*5),gy1=Math.floor(r()*4),gy2=5+Math.floor(r()*4),o=[[8,4]];range(2,13).forEach(x=>{if(x!==gx1&&x!==gx2&&x!==8)o.push([x,4]);});range(0,8).forEach(y=>{if(y!==gy1&&y!==gy2&&y!==4)o.push([8,y]);});return o;}},
 {id:"zigzag",name:"ジグザグ",gen:r=>{const o=[];range(0,6).forEach(y=>{o.push([4,y]);o.push([10,y]);});range(2,8).forEach(y=>{o.push([7,y]);o.push([13,y]);});return o;}},
 {id:"ring",name:"中央の囲い",gen:r=>{const g1=Math.floor(r()*18),g2=Math.floor(r()*18),o=[];let k=0;for(let x=5;x<=10;x++){o.push([x,2]);o.push([x,6]);}for(let y=3;y<=5;y++){o.push([5,y]);o.push([10,y]);}return o.filter((_,i)=>i!==g1&&i!==g2);}},
 {id:"blocks",name:"ブロック群",gen:r=>{const o=[];[[3,1],[3,6],[7,3],[11,1],[11,6],[13,3]].forEach(([x,y])=>{o.push([x,y],[x+1,y],[x,y+1],[x+1,y+1]);});return o;}},
 {id:"diag",name:"斜めの壁",gen:r=>{const g=1+Math.floor(r()*6),o=[];range(0,8).forEach(k=>{if(k!==g)o.push([3+k,k],[4+k,k]);});return o;}}
];

/* ================= フロア生成 ================= */
const OTYPES=["desk","plant","vending","door","clock","switch","bin","locker","sofa","pc","printer","water","tv"];
const OCOLS=["r","b","y","g","w"];
function buildLayout(n,rules,rng){
  const need=new Set(); rules.forEach(r=>(r.need||[]).forEach(x=>need.add(x)));
  const has=id=>rules.some(r=>r.id===id);
  const fl={n,rules,objs:[],obst:new Uint8Array(GW*GH),tiles:new Array(GW*GH).fill(""),items:[],itemGrid:new Uint8Array(GW*GH),
    stairs:[],cams:[],guards:[],lamps:[],wall:new Uint8Array(GW*GH),map:null,off:pick([0,2,4,6,8,10],rng),limit:999,start:null,camMask:null,hasKey:false,hasCard:false};
  const two=need.has("stairs2")||need.has("emerg");
  const mirror=rng()<.5;
  const free=(x,y)=>x>=0&&y>=0&&x<GW&&y<GH&&!fl.obst[y*GW+x];
  // 開始と階段
  const sy=1+Math.floor(rng()*(GH-2));
  if(two){
    fl.start={x:6+Math.floor(rng()*4),y:1+Math.floor(rng()*(GH-2))};
    const ly=1+Math.floor(rng()*(GH-2)), ry=1+Math.floor(rng()*(GH-2));
    let kinds=["normal","normal"]; if(need.has("emerg")) kinds=rng()<.5?["normal","emerg"]:["emerg","normal"];
    fl.stairs.push({x:rng()<.5?0:1,y:ly,side:"L",kind:kinds[0]},{x:rng()<.5?GW-1:GW-2,y:ry,side:"R",kind:kinds[1]});
  } else {
    let sx=Math.floor(rng()*3), ex=GW-1-Math.floor(rng()*3), ey=1+Math.floor(rng()*(GH-2));
    if(mirror){ sx=GW-1-sx; ex=GW-1-ex; }
    fl.start={x:sx,y:sy}; fl.stairs.push({x:ex,y:ey,side:ex<8?"L":"R",kind:"normal"});
  }
  const protectedT=new Set(); const prot=(x,y)=>{for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)protectedT.add((y+dy)*GW+(x+dx));};
  prot(fl.start.x,fl.start.y); fl.stairs.forEach(s=>prot(s.x,s.y));
  { const mp=pick(MAPS,rng), fx=rng()<.5, fy=rng()<.5; fl.map={id:mp.id,name:mp.name};
    for(let [wx,wy] of mp.gen(rng)){ if(fx) wx=GW-1-wx; if(fy) wy=GH-1-wy; if(wx<0||wy<0||wx>=GW||wy>=GH) continue; const wi=wy*GW+wx; if(protectedT.has(wi)) continue; fl.obst[wi]=1; fl.wall[wi]=1; } }
  const place=(t,c)=>{ for(let k=0;k<60;k++){ const x=Math.floor(rng()*GW),y=Math.floor(rng()*GH); const i=y*GW+x; if(fl.obst[i]||protectedT.has(i)) continue; fl.obst[i]=1; fl.objs.push({x,y,t,c}); return true; } return false; };
  // 必須オブジェクト
  need.forEach(k=>{ if(k.startsWith("obj:")){ const t=k.slice(4); place(t,pick(OCOLS,rng)); place(t,pick(OCOLS,rng)); }
    if(k.startsWith("col:")){ const c=k.slice(4); place(pick(OTYPES,rng),c); place(pick(OTYPES,rng),c); place(pick(OTYPES,rng),c); } });
  const total=14+Math.floor(rng()*5);
  while(fl.objs.length<total) place(pick(OTYPES,rng),pick(OCOLS,rng));
  if(need.has("lamp")){ for(let i=0;i<3;i++){ if(place("lamp","w")){ const o=fl.objs[fl.objs.length-1]; fl.lamps.push({x:o.x,y:o.y,px:(o.x+.5)*TS,py:(o.y+.5)*TS}); } } }
  // 警備員
  if(need.has("guard")){
    const cnt=1+(rng()<.4?1:0);
    for(let g=0;g<cnt;g++){
      for(let tr=0;tr<40;tr++){
        const horiz=rng()<.5, len=rng()<.5?3:6;
        const x1=Math.floor(rng()*(GW-(horiz?len:0))), y1=Math.floor(rng()*(GH-(horiz?0:len)));
        const x2=horiz?x1+len:x1, y2=horiz?y1:y1+len;
        let bad=false; for(let k=0;k<=len;k++){ const x=horiz?x1+k:x1,y=horiz?y1:y1+k; if(protectedT.has(y*GW+x)||fl.wall[y*GW+x]) bad=true; }
        if(bad) continue;
        for(let k=0;k<=len;k++){ const x=horiz?x1+k:x1,y=horiz?y1:y1+k; if(fl.obst[y*GW+x]){ fl.obst[y*GW+x]=0; fl.objs=fl.objs.filter(o=>!(o.x===x&&o.y===y)); } }
        fl.guards.push({ax:(x1+.5)*TS,ay:(y1+.5)*TS,bx:(x2+.5)*TS,by:(y2+.5)*TS,per:len*2,ph:Math.floor(rng()*len*2)});
        break;
      }
    }
  }
  // カメラ
  if(need.has("cam")){
    const rule=rules.find(r=>r.g==="cam"); const cnt=2+(n<=6&&rng()<.5?1:0);
    const sides=shuffle(["T","B","L","R"],rng);
    for(let i=0;i<cnt;i++){
      const s=sides[i]; let col;
      if(rule.camCols&&i===0) col=rule.camCols[0]; else col=pick(["r","b","g"].filter(c=>!rule.camCols||i>0),rng);
      if(rule.camCols&&i===1&&col===rule.camCols[0]) col=pick(["r","b","g"].filter(c=>c!==rule.camCols[0]),rng);
      const cm={col,amp:.5+rng()*.4,per:rng()<.5?6:12,ph:rng()*Math.PI*2,fov:.26,side:s};
      if(s==="T"){cm.px=(1.5+rng()*(GW-3))*TS;cm.py=0;cm.base=Math.PI/2+(rng()-.5)*.5;cm.range=8*TS;}
      if(s==="B"){cm.px=(1.5+rng()*(GW-3))*TS;cm.py=GH*TS;cm.base=-Math.PI/2+(rng()-.5)*.5;cm.range=8*TS;}
      if(s==="L"){cm.px=0;cm.py=(1.5+rng()*(GH-3))*TS;cm.base=(rng()-.5)*.5;cm.range=11*TS;}
      if(s==="R"){cm.px=GW*TS;cm.py=(1.5+rng()*(GH-3))*TS;cm.base=Math.PI+(rng()-.5)*.5;cm.range=11*TS;}
      fl.cams.push(cm);
    }
  }
  // タイル
  for(let i=0;i<26;i++){ const x=Math.floor(rng()*GW),y=Math.floor(rng()*GH),k=y*GW+x; if(fl.obst[k]||protectedT.has(k)) continue; fl.tiles[k]=pick(["r","b","y","g"],rng); }
  // アイテム

function precompute(fl){
  fl.camMask=new Uint8Array(SUBS*NP);
  if(!fl.cams.length) return;
  for(let s=0;s<SUBS;s++){ const t=s/8;
    for(const cm of fl.cams){ const bit=COLBIT[cm.col];
      for(let j=0;j<=36;j++)for(let i=0;i<=64;i++){ if(camSees(fl,cm,t,i*15,j*15,true)) fl.camMask[s*NP+j*65+i]|=bit; } } }

  const setC=(sub,px,py,tx,ty,moving,st,fg,still)=>{ c.sub=sub; c.t=sub/8; c.abs=0; c.px=px; c.py=py; c.pi=Math.round(py/15)*65+Math.round(px/15); c.tx=tx; c.ty=ty; c.moving=moving; c.stance=STN[st]; c.key=!!(fg&1); c.card=!!(fg&2); c.still=still; c.col=fl.tiles[ty*GW+tx]; };

  const buckets=[]; const push=(T,s)=>{ (buckets[T]||(buckets[T]=[])).push(s); };

  if(viol(frameRules,c)) return null;

        const t2=enc(tile,tm,ns,fg); if(dist[t2]===-1||T<dist[t2]){ dist[t2]=T; par[t2]=s; act[t2]=100+ns; b.push(t2); } }

      { const tm2=(tm+1)%TK; let ok=true;

        if(ok){ const t2=enc(tile,tm2,st,fg); if(dist[t2]===-1||T+1<dist[t2]){ dist[t2]=T+1; par[t2]=s; act[t2]=200; push(T+1,t2); } } }

          if(viol(frameRules,c)){ ok=false; break; }
          if(f>=.5&&!succ){ const sa=stairAt[ny*GW+nx]; if(sa){ succ=true; stObj=sa; const bad=stairRules.some(r=>r.stair(c,sa)); if(bad) ok=false; break; } }

    s=p; }
  acts.reverse();
  return {t:best.t*.25,acts};
}

function genFloor(n,seed,rulesMust){
  const rng=mulberry(seed);
  const count=clamp(2+Math.floor((10-n)/3)+(n===10?1:0)+1,3,6);
  for(let attempt=0;attempt<40;attempt++){
    const cnt=attempt>25?Math.max(2,count-2):attempt>14?count-1:count;
    const rules=pickRules(cnt,rng,n,null);
    const fl=buildLayout(n,rules,rng); if(!fl) continue;
    const sol=solve(fl); if(!sol||(sol.t>45&&attempt<35)) continue;
    fl.sol=sol; fl.attempt=attempt;
    if(fl.hasLimit) fl.limit=Math.ceil(sol.t*1.7+10);
    return fl;
  }
  const rules=[RM.touchAny]; const fl=buildLayout(n,rules,rng); fl.sol=solve(fl); return fl;
}

  const ax=gp.axes[0]||0,ay=gp.axes[1]||0; let dx=0,dy=0;

  if(it===3&&!r.card){ r.card=true; say("カードを拾った","card"); sfx.pick(); }

  if(st){ const c=mkCtx(r); for(const q of fl.rules){ if(q.stair){ const w=q.stair(c,st); if(w) return die(q,w); } } descend(); }
}
function advance(r,dt){
  const fl=G.fl; let rem=dt, now=r.t-dt;
  while(rem>1e-9&&!r.over){
    if(!r.seg){
      if(r.ap){ const a=r.ap[r.apI];
        if(!a){} else { const due=a.T*.25; if(a.k==="st"){ if(due<=now+1e-6){ r.st=a.st; r.apI++; continue; } }

            else { const w=due-now; if(w<=rem){ rem-=w; now+=w; continue; } else { rem=0; break; } } } } }
      if(!r.route.length){ break; }
      const nx=r.route.shift(); r.seg={tx:(nx.x+.5)*TS,ty:(nx.y+.5)*TS,tile:{x:nx.x,y:nx.y}};
    }
    const sp=SPEED[r.st], dx=r.seg.tx-r.px, dy=r.seg.ty-r.py, d=Math.hypot(dx,dy), step=sp*rem;
    if(step>=d){ r.px=r.seg.tx; r.py=r.seg.ty; const used=d/sp; rem-=used; now+=used; r.seg=null; }
    else { r.px+=dx/d*step; r.py+=dy/d*step; rem=0; }
    // タイルの切り替わり
    const t=tileOf(r.px,r.py); if(t.y*GW+t.x!==r.tile){ onEnterTile(r,t); if(r.over) break; }
    if(!r.seg){ const c=mkCtxMoving(r,true); const w=checkFrame(c); if(w) return die(w[0],w[1]); }
  }

  const al=fl.ev.alarm&&evOn(fl,"alarm",r.t,false)?1:0; r.alarmA+=(al-r.alarmA)*Math.min(1,dt*3);
  // 通知音

    if(B<=CYC) seg(A,B); else { seg(A,CYC); seg(0,B-CYC); } });
  if(rows.length){ const u=((r.t%CYC)+CYC)%CYC; ctx.fillStyle="#e9e5da"; ctx.fillRect(x0+wd*u/CYC-1,6,3,38); }
  // 階の表示
  drawIcon(ctx,"stairs",30,MAPY/2,26,"#e9e5da"); txt(ctx,`${fl.n}F`,56,MAPY/2,26,"#e9e5da","left",900);
  txt(ctx,"→ 1F",118,MAPY/2+1,14,"#8d979e","left",500); if(fl.map){ drawIcon(ctx,"map",186,MAPY/2,18,"#8d979e"); txt(ctx,fl.map.name,202,MAPY/2+1,13,"#8d979e","left",500); }
  if(fl.hasLimit){ const left=Math.max(0,fl.limit-r.t); drawIcon(ctx,"timer",DW-90,MAPY/2,24,left<10?"#e04a3a":"#e9e5da"); txt(ctx,Math.ceil(left)+"s",DW-72,MAPY/2,20,left<10?"#e04a3a":"#e9e5da","left",700); }
  if(r.key) drawIcon(ctx,"key",DW-130,MAPY/2,22,"#8fd0ff"); if(r.card) drawIcon(ctx,"card",DW-160,MAPY/2,22,"#8fd0ff");
  if(!rows.length&&!fl.hasLimit) txt(ctx,"この階に、時間で変わる仕掛けはない",x0,MAPY/2,13,"#59626a","left",500);
  if(r.over&&G.mode==="dead"){ ctx.fillStyle="rgba(224,74,58,.22)"; ctx.fillRect(0,0,DW,DH); }
  ctx.restore();
}
let last=0;
function loop(ts){ requestAnimationFrame(loop); const dt=Math.min(.05,(ts-last)/1000||0); last=ts; AT=ts/1000; pollPad(); update(dt); draw(); }

  $("#how").innerHTML=[["camera","規則は階ごとにランダム。全部で"+RULES.length+"種類"],["stairs","10Fから階段を降りて、1Fの出口へ"],["gear","タップ・スティック・ボタン・キーボード・コントローラーで遊べる"]].map(([n,t])=>`<div>${svg(n,{size:44,color:"#e9e5da",ban:n==="camera"?false:false}).replace('class="ic"','class="ic"')}${t}</div>`).join("");
}

}

/* ---- 設定画面 ---- */
function dropdown(el,opts,get,set){
  el.classList.add("dd");
  const draw=()=>{ const cur=opts.find(o=>o.v===get())||opts[0];
    const row=(o,i,list)=>`${svg(o.ic,{size:26,color:"#e9e5da"})}<span class="ddt"><b>${o.t}</b><small>${o.d||""}</small></span>`;
    el.innerHTML=`<button class="ddb" type="button">${row(cur)}${svg("chev",{size:18,color:"#8d979e"})}</button><div class="ddl">${opts.map((o,i)=>`<button class="ddo ${o.v===cur.v?"on":""}" data-v="${o.v}" type="button" style="--i:${i}">${row(o)}${o.v===cur.v?`<span style="margin-left:auto">${svg("check",{size:18,color:"#e04a3a"})}</span>`:""}</button>`).join("")}</div>`;
    el.querySelector(".ddb").addEventListener("click",e=>{ e.stopPropagation(); document.querySelectorAll(".dd.open").forEach(x=>{ if(x!==el) x.classList.remove("open"); }); el.classList.toggle("open"); });
    el.querySelectorAll(".ddo").forEach(b=>b.addEventListener("click",e=>{ e.stopPropagation(); set(b.dataset.v); draw(); el.classList.remove("open"); }));
  };
  draw(); return draw;
}
document.addEventListener("click",()=>document.querySelectorAll(".dd.open").forEach(x=>x.classList.remove("open")));
function setRange(inp,v){ inp.value=Math.round(v*100); inp.style.setProperty("--p",inp.value+"%"); }
function renderSettings(){
  dropdown($("#ddCtl"),[
    {v:"tap",ic:"hand",t:"タップで移動",d:"行き先をタップ→もう一度タップで出発"},
    {v:"stick",ic:"joystick",t:"ジョイスティック",d:"画面のスティックを倒して移動"},
    {v:"dpad",ic:"dpad",t:"方向ボタン",d:"画面の十字ボタンで移動"},
    {v:"gamepad",ic:"gamepad",t:"コントローラー",d:"左スティック / 十字キー、A B X で姿勢"},
    {v:"keyboard",ic:"keyboard",t:"キーボード",d:"矢印キー / WASD、1 2 3 で姿勢"}],
    ()=>S.ctl,v=>{ S.ctl=v; saveS(); applyCtl(); rowSide(); });
  dropdown($("#ddSide"),[{v:"left",ic:"left",t:"画面の左",d:"左手で操作する"},{v:"right",ic:"right",t:"画面の右",d:"右手で操作する"}],()=>S.side,v=>{ S.side=v; saveS(); applyCtl(); });
  const rowSide=()=>{ $("#rowSide").style.display=(S.ctl==="stick"||S.ctl==="dpad")?"flex":"none"; }; rowSide();
  const tg=$("#tgCalm"); tg.innerHTML=`<button class="tg ${S.calm?"on":""}" type="button" role="switch" aria-checked="${!!S.calm}"></button>`;
  tg.firstChild.addEventListener("click",e=>{ S.calm=!S.calm; saveS(); applyCalm(); e.target.classList.toggle("on",S.calm); });
  $("#mIco").innerHTML=svg("speaker",{size:24,color:"#e9e5da"});
  const vm=$("#vMaster"); setRange(vm,S.master); $("#pMaster").textContent=vm.value+"%";
  vm.oninput=()=>{ S.master=vm.value/100; setRange(vm,S.master); $("#pMaster").textContent=vm.value+"%"; saveS(); };
  $("#sndList").innerHTML=SD.map(([id,name,ic])=>`<div class="snd ${S.on[id]?"":"off"}" data-id="${id}"><span class="sico">${svg(ic,{size:22,color:"#e9e5da"})}</span><span class="sn">${name}</span><input type="range" min="0" max="100"><span class="pct"></span><button class="tg ${S.on[id]?"on":""}" type="button" role="switch"></button><button class="tbtn" type="button">試す</button></div>`).join("");
  document.querySelectorAll("#sndList .snd").forEach(row=>{
    const id=row.dataset.id,inp=row.querySelector("input"),pc=row.querySelector(".pct"),tgb=row.querySelector(".tg"),tb=row.querySelector(".tbtn");
    setRange(inp,S.vol[id]); pc.textContent=inp.value+"%";
    inp.oninput=()=>{ S.vol[id]=inp.value/100; setRange(inp,S.vol[id]); pc.textContent=inp.value+"%"; saveS(); };
    inp.onchange=()=>{ audio(); play(id,0); };
    tgb.onclick=()=>{ S.on[id]=!S.on[id]; saveS(); tgb.classList.toggle("on",S.on[id]); row.classList.toggle("off",!S.on[id]); };
    tb.onclick=()=>{ audio(); play(id,0); };
  });
  $("#keyHelp").innerHTML=`<div><b>キーボード</b><kbd>←↑↓→</kbd> / <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移動<br><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> または <kbd>Z</kbd><kbd>X</kbd><kbd>C</kbd> 歩く / 走る / しゃがむ<br><kbd>Q</kbd><kbd>E</kbd> 姿勢を切り替え　<kbd>R</kbd> 規則書</div><div><b>コントローラー</b>左スティック / 十字キー 移動<br>A 歩く　B 走る　X しゃがむ<br>LB RB 姿勢を切り替え　Start 規則書<br>メニューでは A で決定</div>`;
}
let setBack=null;
function openSettings(){ const cur=document.querySelector(".screen.on"); if(cur&&cur.id==="settings") return; setBack=cur?cur.id:null; if(G.mode==="play") G.paused=true; renderSettings(); showScreen("settings"); }
function closeSettings(){ G.paused=false; showScreen(setBack); applyCtl(); if(G.mode==="brief"||setBack==="brief") $("#bHint").textContent={tap:"移動：行き先を1回タップで経路を表示、もう1回タップで出発",stick:"移動：ジョイスティックを倒す",dpad:"移動：方向ボタンを押す",gamepad:"移動：左スティックか十字キー",keyboard:"移動：矢印キーかWASD"}[S.ctl]; renderSheet(); }
$("#setTop").addEventListener("click",openSettings); $("#setBtn").addEventListener("click",openSettings); $("#setClose").addEventListener("click",closeSettings);

function titleInfo(){ $("#best").textContent=G.best<=10?(G.best===0?"最高記録：脱出済み":`最高記録：${G.best}F まで到達`):"規則は全部で"+RULES.length+"種類。毎回ランダムに選ばれる。"; }

applyCalm(); applyCtl(); buildTower(); fit(); buildHow(); titleInfo(); renderStance(); requestAnimationFrame(loop);
window.__g={G,S,IN,RM,MAPS,pickRules,mulberry,openSettings,closeSettings,RULES,genFloor,solve,enterFloor,newRun,update,advance,buildRun,setStance,tileOf,die,mk:()=>G.run};
})();
